apiVersion: v1
kind: Namespace
metadata:
  name: topo-eval-lineage-causal-__RUN_ID__
  labels:
    topo.ai/evaluation-run: __RUN_ID__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lineage-causal-fixture
  namespace: topo-eval-lineage-causal-__RUN_ID__
  labels:
    app.kubernetes.io/name: lineage-causal-fixture
    topo.ai/evaluation-run: __RUN_ID__
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lineage-causal-fixture
      topo.ai/evaluation-run: __RUN_ID__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lineage-causal-fixture
        topo.ai/evaluation-run: __RUN_ID__
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: __IMMUTABLE_IMAGE_REF__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
