[project]
name = "topo-ai-cli"
version = "0.2.0"
description = "Command-line client for Topo AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.21,<1.0",
    "httpx>=0.28,<1.0",
    "rich>=14,<15",
]

[project.scripts]
topo = "topo_cli.main:app"

[build-system]
requires = [
    "setuptools>=75",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]