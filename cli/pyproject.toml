[project]
name = "topo-ai-cli"
version = "0.8.0"
description = "Command-line client for Topo AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.21,<1.0",
    "httpx>=0.28,<1.0",
    "rich>=14,<15",
    "keyring>=25,<27",
]

[project.optional-dependencies]
dev = [
    "build>=1",
    "twine>=6",
    "pytest>=8",
    "pytest-cov>=6",
]

[project.scripts]
topo = "topo_cli.main:app"

[build-system]
requires = [
    "setuptools>=75",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"