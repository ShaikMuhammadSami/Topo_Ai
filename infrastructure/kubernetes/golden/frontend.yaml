apiVersion: v1
kind: ServiceAccount
metadata:
  name: topo-frontend
  namespace: topo-system
  labels:
    app.kubernetes.io/name: topo-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: topo-ai
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topo-frontend
  namespace: topo-system
  labels:
    app.kubernetes.io/name: topo-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: topo-ai
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: topo-frontend
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: topo-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: topo-ai
    spec:
      serviceAccountName: topo-frontend
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: topo-frontend
              app.kubernetes.io/component: web
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: topo-frontend
              app.kubernetes.io/component: web
      containers:
        - name: frontend
          image: 297361542190.dkr.ecr.us-east-1.amazonaws.com/topo-golden/topo@sha256:ba86d89733b552cd3ced4792f40b59032524f83275b806ffc20f3249b8b1bdf1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: topo-frontend-internal
  namespace: topo-system
  labels:
    app.kubernetes.io/name: topo-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: topo-ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: topo-frontend
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: topo-frontend
  namespace: topo-system
  labels:
    app.kubernetes.io/name: topo-frontend
    app.kubernetes.io/part-of: topo-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: topo-frontend
      app.kubernetes.io/component: web
