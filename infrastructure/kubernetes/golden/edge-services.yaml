apiVersion: v1
kind: Service
metadata:
  name: topo-backend-edge
  namespace: topo-system
  labels:
    app.kubernetes.io/name: topo-backend
    app.kubernetes.io/component: api-edge
    app.kubernetes.io/part-of: topo-ai
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: topo-backend
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 32080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: topo-frontend
  namespace: topo-system
  labels:
    app.kubernetes.io/name: topo-frontend
    app.kubernetes.io/component: web-edge
    app.kubernetes.io/part-of: topo-ai
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: topo-frontend
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 32081
      protocol: TCP
