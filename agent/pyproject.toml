[project]
name = "topo-ai-agent"
version = "0.7.0"
description = "Infrastructure discovery agent for Topo AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.21,<1.0",
    "httpx>=0.28,<1.0",
    "rich>=14,<15",
    "kubernetes>=30,<40",
    "docker>=7,<8",
    "psutil>=6,<8",
    "boto3>=1.34,<2",
    "azure-identity>=1.17,<2",
    "azure-mgmt-resourcegraph>=8,<9",
    "azure-mgmt-subscription>=3,<4",
    "google-auth>=2.30,<3",
    "google-cloud-resource-manager>=1.14,<2",
    "google-cloud-asset>=3.26,<5",
    "google-cloud-compute>=1.20,<2",
    "google-cloud-container>=2.45,<3",
    "google-cloud-logging>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build>=1",
]

[project.scripts]
topo-agent = "topo_agent.main:app"
topo-sensor = "topo_agent.sensor_main:app"


[build-system]
requires = [
    "setuptools>=75",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"