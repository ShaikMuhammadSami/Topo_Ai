# Topo agent: in-cluster Kubernetes observer.
#
# Before applying:
#   1. Build the image and make it available to the cluster under the tag below:
#        docker build -t topo-agent:0.7.0 agent/
#   2. Enroll the agent once from a workstation. The values passed to
#      `topo-agent enroll` (--server, --name, --cluster, --environment,
#      --namespace) must match the topo-agent-config ConfigMap below,
#      otherwise the backend rejects the agent's submissions.
#   3. Create the credentials Secret from the enrollment result
#      (`topo-agent status` shows the agent ID):
#        kubectl -n topo-system create secret generic topo-agent-credentials \
#          --from-literal=agent-id=<AGENT_ID> \
#          --from-file=agent-token=<FILE_CONTAINING_AGENT_TOKEN>
#   4. Edit the ConfigMap values, then: kubectl apply -f agent/deploy/kubernetes.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: topo-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: topo-agent-config
  namespace: topo-system
  labels:
    app.kubernetes.io/name: topo-agent
data:
  # Topo backend URL as reachable from inside the cluster. The default
  # reaches a backend on the host from Docker Desktop Kubernetes.
  backend-url: http://host.docker.internal:8000
  # Must match the --name, --cluster and --environment used at enrollment.
  agent-name: docker-desktop-agent
  cluster-name: docker-desktop
  environment: development
  # Comma-separated namespaces to observe; empty observes all namespaces.
  # Must match the --namespace values used at enrollment.
  namespaces: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: topo-agent
  namespace: topo-system
  labels:
    app.kubernetes.io/name: topo-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: topo-agent-readonly
  labels:
    app.kubernetes.io/name: topo-agent
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
      - pods
      - services
      - endpoints
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: topo-agent-readonly
  labels:
    app.kubernetes.io/name: topo-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: topo-agent-readonly
subjects:
  - kind: ServiceAccount
    name: topo-agent
    namespace: topo-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: topo-agent
  namespace: topo-system
  labels:
    app.kubernetes.io/name: topo-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: topo-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: topo-agent
    spec:
      serviceAccountName: topo-agent
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: topo-agent
          image: topo-agent:0.7.0
          imagePullPolicy: IfNotPresent
          args:
            - run
          env:
            - name: TOPO_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: topo-agent-config
                  key: backend-url
            - name: TOPO_AGENT_ID
              valueFrom:
                secretKeyRef:
                  name: topo-agent-credentials
                  key: agent-id
            - name: TOPO_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: topo-agent-credentials
                  key: agent-token
            - name: TOPO_AGENT_NAME
              valueFrom:
                configMapKeyRef:
                  name: topo-agent-config
                  key: agent-name
            - name: TOPO_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: topo-agent-config
                  key: cluster-name
            - name: TOPO_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: topo-agent-config
                  key: environment
            - name: TOPO_NAMESPACES
              valueFrom:
                configMapKeyRef:
                  name: topo-agent-config
                  key: namespaces
            - name: TOPO_ENABLED_PLUGINS
              value: kubernetes
            - name: TOPO_CHANGE_WATCH_KUBERNETES
              value: "true"
            - name: TOPO_CHANGE_WATCH_AWS
              value: "false"
            - name: TOPO_CHANGE_WATCH_AZURE
              value: "false"
            - name: TOPO_CHANGE_WATCH_GCP
              value: "false"
            - name: TOPO_COLLECTION_INTERVAL
              value: "300"
            - name: TOPO_CHANGE_WATCH_INTERVAL
              value: "30"
            - name: TOPO_HEARTBEAT_INTERVAL
              value: "30"
            - name: TOPO_AGENT_HOME
              value: /var/lib/topo-agent
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: state
              mountPath: /var/lib/topo-agent
            - name: temporary
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: state
          emptyDir: {}
        - name: temporary
          emptyDir: {}
