name: Tracked-tree secret hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check tracked files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test secret scanner
        run: >
          python -m unittest discover
          -s scripts/security/tests
          -p "test_*.py"

      - name: Scan tracked tree
        run: python scripts/security/check_tracked_secrets.py
