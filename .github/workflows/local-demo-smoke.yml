name: Local demo smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Build, seed, and smoke-check the local demo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python for the smoke check
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Load documented local defaults
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start local demo
        run: docker compose up --build --detach --wait

      - name: Seed sample workspace and incident
        run: docker compose exec -T backend python -m app.demo_seed

      - name: Verify backend APIs and frontend route
        run: python scripts/smoke/local_demo.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers and remove demo data
        if: always()
        run: docker compose down --volumes
