name: Topo CLI

on:
  pull_request:
    paths:
      - "cli/**"
      - "backend/app/security/**"
      - "backend/app/api/system.py"
      - ".github/workflows/topo-cli.yml"

  push:
    branches:
      - main

    tags:
      - "cli-v*"

    paths:
      - "cli/**"
      - "backend/app/security/**"
      - "backend/app/api/system.py"
      - ".github/workflows/topo-cli.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }} Python ${{ matrix.python }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        python:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: cli/pyproject.toml

      - name: Upgrade packaging tools
        run: >
          python -m pip install
          --upgrade pip setuptools wheel

      - name: Install CLI
        run: >
          python -m pip install
          -e "./cli[dev]"

      - name: Compile CLI
        run: >
          python -m compileall
          cli/src

      - name: Run CLI tests
        run: >
          pytest cli/tests
          --cov=topo_cli
          --cov-report=term-missing

  build:
    name: Build distribution

    needs:
      - test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cli/pyproject.toml

      - name: Install build tools
        run: >
          python -m pip install
          --upgrade build twine

      - name: Build CLI distributions
        working-directory: cli
        run: python -m build

      - name: Validate distributions
        working-directory: cli
        run: python -m twine check dist/*

      - name: Upload wheel and source distribution
        uses: actions/upload-artifact@v7
        with:
          name: topo-ai-cli-${{ github.sha }}
          path: |
            cli/dist/*.whl
            cli/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create CLI release

    if: startsWith(
      github.ref,
      'refs/tags/cli-v'
      )

    needs:
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: >
          python -m pip install
          --upgrade build twine

      - name: Build release distributions
        working-directory: cli
        run: python -m build

      - name: Validate release distributions
        working-directory: cli
        run: python -m twine check dist/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            cli/dist/*.whl
            cli/dist/*.tar.gz