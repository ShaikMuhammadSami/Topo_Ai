name: Portable test suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-golden:
    name: Terraform golden mock contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Initialize Terraform without a backend
        run: terraform -chdir=infrastructure/aws/golden init -backend=false -input=false

      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure/aws/golden fmt -check -recursive

      - name: Validate Terraform configuration
        run: terraform -chdir=infrastructure/aws/golden validate

      - name: Run Terraform mock-provider contracts
        run: terraform -chdir=infrastructure/aws/golden test

  frontend:
    name: Frontend tests, lint, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

  python-contracts:
    name: Cloud, migration, snapshot, and evaluation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: backend

    steps:
      - name: Check out repository with frozen history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked backend dependencies and test runner
        run: >-
          python -m pip install
          -r backend/requirements.lock
          -r scripts/cloud/cx0/requirements.txt
          "pytest>=8,<10"

      - name: Compile backend
        run: python -m compileall backend/app

      - name: Run cloud contracts
        run: python -m pytest scripts/cloud/tests

      - name: Run migration and snapshot regressions
        run: >-
          python -m pytest
          backend/tests/test_agent_collection_integrity.py
          backend/tests/test_schema_migrations.py
          backend/tests/test_identity_transition_diff.py
          backend/tests/test_temporal_semantics.py
          backend/tests/test_relationship_provenance.py

      - name: Run portable offline evaluation tests
        run: python -m pytest evaluation/tests -ra

  postgres-tenant-closure:
    name: PostgreSQL tenant closure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      TOPO_TEST_POSTGRES_URL: >-
        postgresql+psycopg://topo_test:topo_test@127.0.0.1:5432/topo_test

    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: topo_test
          POSTGRES_PASSWORD: topo_test
          POSTGRES_DB: topo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U topo_test -d topo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked backend dependencies and test runner
        run: >-
          python -m pip install
          -r backend/requirements.lock
          "pytest>=8,<10"

      - name: Run PostgreSQL tenant closure regression
        run: python -m pytest backend/tests/test_domain_tenant_closure.py

  agent:
    name: Agent regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: agent/src

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.lock

      - name: Install locked agent dependencies and test runner
        run: >-
          python -m pip install
          -r agent/requirements.lock
          "pytest>=8,<10"

      - name: Compile agent
        run: python -m compileall agent/src

      - name: Run agent regressions
        run: >-
          python -m pytest
          agent/tests/test_collection_integrity.py
          agent/tests/test_continuous_capture.py
          agent/tests/test_kubernetes_deployment_template.py
          agent/tests/test_kubernetes_failure_status.py
          agent/tests/test_plugin_manager.py
